packages:
  - 'packages/*'

blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@polygonlabs/*'
  - '@maticnetwork/*'
  - '@agglayer/*'
  - '@0xsequence/*'
  - '@0xtrails/*'
# katex 0.16.34 (transitive dep of markdownlint-cli2) has a broken ESM build
# where __VERSION__ is not replaced at build time, crashing on Node 24.
#
# markdown-it, js-yaml@4, and uuid@10 are forced past versions with open
# security advisories that their parents (markdownlint-cli2, @hey-api/
# json-schema-ref-parser, @0xsequence/connect) still pin below the patched
# release. Scoped selectors (js-yaml@4, uuid@10) keep the fix inside the
# affected major so parents expecting other majors (changesets' js-yaml@3)
# are untouched. Drop each entry once its parent moves its own range.
overrides:
  katex: ^0.16.38
  markdown-it: '>=14.2.0'
  'js-yaml@4': '>=4.2.0'
  'uuid@10': '^11.1.1'
onlyBuiltDependencies:
  # Runs a postinstall hook that downloads the Chromium binary into
  # ~/.cache/ms-playwright. This is how zod-to-openapi-heyapi's browser-mode
  # vitest suite gets its browser — declaratively, at install time. Without this
  # allowlist entry our default block on dependency build scripts would
  # silently skip the download and the browser tests would fail to launch.
  #
  # CAVEAT: this postinstall only fires on a COLD install. On a warm pnpm store
  # (CI cache hit) pnpm restores the package from its side-effects cache and
  # skips the build script — but the browser lives in ~/.cache/ms-playwright,
  # outside the store, so it is neither re-run nor cached, and the browser tests
  # fail with "Executable doesn't exist". zod-to-openapi-heyapi's `test` script
  # therefore re-ensures the browser with an idempotent `playwright install
  # chromium` (a no-op when already present); that is the deterministic safety
  # net — this postinstall is just the cold-path optimisation.
  - '@playwright/browser-chromium'
  - esbuild
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'undici-types@6.19.8'
  - 'semver@6.3.1'
